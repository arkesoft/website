<!doctype html><html><meta charset="utf-8"><title>Local concept film renderer</title><canvas id="film" width="1600" height="900"></canvas><script>
const canvas=document.getElementById('film'),ctx=canvas.getContext('2d');const sources=['studio','coffee','architecture','flow'].map(n=>'/assets/'+n+'-v3.'+(n==='flow'?'svg':'webp'));
const pictures=Promise.all(sources.map(src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src;})));
function photo(img,progress,alpha=1){ctx.globalAlpha=alpha;const scale=Math.max(1600/img.width,900/img.height)*(1.035+progress*.035),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(1600-w)/2-progress*10,(900-h)/2,w,h);ctx.globalAlpha=1;}
window.recordFilm=async function(mode){const images=await pictures,seconds=mode==='hero'?8:16;const mime='video/webm;codecs=vp9';const stream=canvas.captureStream(24);const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:mode==='hero'?1800000:2400000});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const finished=new Promise(resolve=>recorder.onstop=async()=>{const blob=new Blob(chunks,{type:'video/webm'}),r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.readAsDataURL(blob);});const start=performance.now();recorder.start();await new Promise(resolve=>{function draw(){const elapsed=(performance.now()-start)/1000;ctx.fillStyle='#101010';ctx.fillRect(0,0,1600,900);if(mode==='hero'){photo(images[0],.5-.5*Math.cos(Math.min(elapsed/seconds,1)*Math.PI*2));}else{const index=Math.min(3,Math.floor(elapsed/4)),p=(elapsed%4)/4;photo(images[index],p);if(p<.16&&index>0)photo(images[index-1],1,1-p/.16);const g=ctx.createLinearGradient(0,200,0,900);g.addColorStop(0,'#00000000');g.addColorStop(1,'#000000bd');ctx.fillStyle=g;ctx.fillRect(0,0,1600,900);ctx.fillStyle='#fff';ctx.font='bold 23px Arial';ctx.fillText('arkesoft ↗',80,80);ctx.font='14px Arial';ctx.fillText('KONSEPT PROJE SEÇKİSİ / 2026',80,650);ctx.font='bold 76px Arial';ctx.fillText(['İyi fikirler masada başlar.','Bir markanın kendi sesi.','Dijitalde iyi bir ilk izlenim.','İşinize uyan yazılımlar.'][index],80,750);ctx.font='22px Arial';ctx.fillStyle='#eee2d2';ctx.fillText(['Tasarım, yazılım ve iletişimi birlikte düşünüyoruz.','Morrow Coffee — örnek marka ve mağaza çalışması.','Forma Studio — örnek kurumsal web deneyimi.','Akış — örnek operasyon yönetim arayüzü.'][index],83,800);ctx.fillStyle='#e23a4f';ctx.fillRect(80,840,1440*Math.min(elapsed/seconds,1),4);}if(elapsed<seconds)requestAnimationFrame(draw);else resolve();}draw();});recorder.stop();const result=await finished;stream.getTracks().forEach(t=>t.stop());return result;};
</script></html>
